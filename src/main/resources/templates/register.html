<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
</head>
<body>
<h1>ユーザー登録</h1>
<form id="registerForm">
    <label>ユーザー名: <input type="text" id="username" required></label><br>
    <label>パスワード: <input type="password" id="password" required></label><br>
    <button type="submit">登録</button>
</form>
<p id="message"></p>

<script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const resp = await fetch("/user", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({username, password})
        });
        const data = await resp.json();
        if(resp.ok){
            sessionStorage.setItem("userId", data.data.id);
            window.location.href = "select-prefecture.html";
        } else {
            document.getElementById("message").textContent = data.status;
        }
    });
</script>
</body>
</html>
